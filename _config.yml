  # 全站
  cursor_tail: true          # 鼠标拖尾：鼠标移动时留下一条橙蓝渐变的光带
  cursor_spotlight: true     # 鼠标聚光灯：页面背景上跟着鼠标移动的一团柔光
  ripple: true               # 点击水波纹：点按钮、图标、卡片时从点击处扩散水波；点空白处出现一圈涟漪
  hover_glow: true           # 悬停发光：鼠标放到按钮、图标、卡片、照片上时发出柔和光晕
  theme_toggle: true         # 右上角日夜切换按钮：点击后新配色从按钮处以圆形扩散铺满页面
  intro: true                # 开场动画：第一次打开网站时描出鳄鱼标志，然后像幕布一样拉开（每个浏览器只放一次；网址后加 ?intro 可以重看）
  title_letters: true        # 章节标题逐字浮现：About、News、CV 各部分标题滚动到时一个字母一个字母弹出来
  local_weather: true        # 页脚显示 Gainesville 的当前时间和天气（设置在上面第二部分的 footer_clock）
  # 首页
  name_decode: true          # 名字解码：进入首页时 "Yu Hu" 从乱码一个个解码出来，鼠标移上去会再解码一次
  network_pulse: true        # 神经网络背景：点击空白处发出信号沿网络传开，闲置时也会偶尔自己"放电"
  about_highlight: true      # About 逐词点亮：文字随滚动一个词一个词变深
  photo_flip: true           # 照片 3D 翻转：点击照片翻到背面
  marquee: true              # 关键词跑马灯（关键词在第三部分 home → marquee）
  # Travel
  globe: true                # 3D 地球：false 则换回可以缩放到街道的平面地图
  globe_card_link: true      # 卡片联动地球：鼠标放到地点卡片上，地球自动转到那个地方
  constellation: true        # 星座彩蛋：星空里偶尔连出 "YH" 或一只鳄鱼
  # CV
  cv_timeline: true          # CV 时间线：经历和项目左边的竖线随滚动往下生长，经过的圆点亮起
  copy_citation: true        # 论文一键复制引用
  # 404 页面
  game_404: true             # 404 小游戏：鳄鱼跳障碍

# 彩蛋：在首页点击大标题 "Yu Hu"，或者在任意页面用键盘输入 secret 这个词，
#       屏幕中央会淡入 image 这张图，下面一行 message 文字，停几秒后淡出。
#       enabled 写 false 关闭；secret 留空则只能点标题触发；image 留空 "" 则只显示文字。
easter_egg:
  enabled: true
  secret: gogators           # 只用小写字母
  message: "Go Gators!"
  image: /images/go-gators.webp   # 彩蛋图片，放在 images 文件夹
