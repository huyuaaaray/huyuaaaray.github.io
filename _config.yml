# =====================================================================
# 三、首页
# =====================================================================
home:
  # 搜索引擎和分享链接时显示的一句话介绍
  description: >-
    Yu Hu is a data scientist at the University of Florida College of Medicine
    building clinical AI with large language models on EHR and clinical notes.

  # 名字下方循环打字显示的身份，按顺序轮播
  roles:
    - Data Scientist
    - Clinical NLP
    - LLM Evaluation
    - LLMOps

  # 身份下面那一行（部门和单位）
  tagline: "Quality & Patient Safety, University of Florida College of Medicine"

  # About 上方的横幅：label 是小标题，text 是用打字机效果打出来的那句话
  research:
    label: Research interest
    text: "I study how to make large language models reliable enough for real clinical work: reading EHR notes, surfacing risks, and supporting the clinicians who review them."

  # About 部分
  about_title: About
  # 简介正文 (Markdown)。段落之间空一行。
  bio: |
    I'm a data scientist at the University of Florida College of Medicine, where I work with the Quality & Patient Safety group to build clinical AI systems. My work focuses on applying large language models to electronic health records and clinical notes, turning unstructured documentation into information that clinicians and quality teams can act on, from readmission analyses to care-coordination programs.

    Along the way, I've built a shared, configuration-driven LLM platform that now supports several clinical programs, developed an LLM-as-a-Judge framework to evaluate model outputs before they reach clinician review, and scaled inference on UF's HiPerGator supercomputer. Over the past three years, this work has led to six peer-reviewed publications in clinical informatics.

    What keeps me in this field is the gap between what AI can do on a benchmark and what it takes to make it reliable in real clinical workflows, and I enjoy closing that gap alongside clinicians, researchers, and engineers.

  # News 部分
  news_title: News
  # 每条新闻：date 是显示的日期，datetime 是 年-月（给搜索引擎看），text 是内容 (Markdown)
  # 最新的放最上面
  news:
    - date: Aug 2026
      datetime: 2026-08
      text: Co-first-author paper on adapting a fair individualized polysocial risk score for hospitalization risk prediction published in *JAMIA Open*.
    - date: '2026'
      datetime: '2026'
      text: Two papers on target trial emulation with decentralized real-world data published in *npj Health Systems* and *eBioMedicine*.
    - date: May 2026
      datetime: 2026-05
      text: Started building a GraphRAG knowledge graph over clinical notes to study heart failure readmission.
    - date: Apr 2026
      datetime: 2026-04
      text: Began leading a clinical LLM evaluation comparing Gemma 4 and MedGemma for patient-level readmission review.
    - date: Feb 2026
      datetime: 2026-02
      text: Started building a shared, configuration-driven LLMOps platform, now used by three clinical programs at UF.
    - date: Sep 2025
      datetime: 2025-09
      text: Joined the Quality & Patient Safety group at the UF College of Medicine as a Data Scientist III.


