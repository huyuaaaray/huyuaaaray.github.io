home:
  description: >-
    Yu Hu is a data scientist at the University of Florida College of Medicine
    building clinical AI with large language models on EHR and clinical notes.

  roles:
    - Data Scientist
    - Clinical NLP
    - LLM Evaluation
    - LLMOps
  tagline: "Quality & Patient Safety, University of Florida College of Medicine"
  research:
    label: Research interest
    text: "I study how to make large language models reliable enough for real clinical work: reading EHR notes, surfacing risks, and supporting the clinicians who review them."
  about_title: About
  bio: |
    I'm a data scientist at the University of Florida College of Medicine, where I work with the Quality & Patient Safety group to build clinical AI systems. My work focuses on applying large language models to electronic health records and clinical notes, turning unstructured documentation into information that clinicians and quality teams can act on, from readmission analyses to care-coordination programs.

    Along the way, I've built a shared, configuration-driven LLM platform that now supports several clinical programs, developed an LLM-as-a-Judge framework to evaluate model outputs before they reach clinician review, and scaled inference on UF's HiPerGator supercomputer. This work has led to six peer-reviewed publications in clinical informatics, and I enjoy doing it alongside clinicians, researchers, and engineers.

  stats:
    - number: 7
      label: peer-reviewed publications
    - number: 3
      suffix: "+"
      label: years in clinical AI
    - number: 3
      label: clinical programs on my LLM platform
  photo_back:
    title: Hi, I'm Yu.
    text: I build clinical AI at the University of Florida in Gainesville. Always happy to talk about LLM evaluation, clinical NLP, or a collaboration.
    cta: Say hello
  photo_flip_label: Click to flip
  marquee:
    - LLM evaluation
    - LLM-as-a-Judge
    - Clinical NLP
    - vLLM
    - Gemma 4
    - GraphRAG
    - LLMOps
    - EHR
    - FHIR
    - OMOP
    - HiPerGator
    - SLURM
    - Pydantic
    - PyTorch
  ask:
    title: Ask about Yu
    greeting: "Hi! I'm a tiny pre-written bot. Pick a question below and I'll tell you about Yu."
    bot_name: Yu-bot
    questions:
      - q: What are you working on right now?
        a: "I lead clinical LLM evaluation for UF's Quality & Patient Safety group: comparing models like Gemma 4 and MedGemma against clinician review, and building LLM-as-a-Judge workflows that send flagged cases to clinicians."
      - q: What is your research focus?
        a: "Making large language models reliable enough for real clinical work: reading EHR notes, surfacing risks, and supporting the clinicians who review them. Lately that includes GraphRAG knowledge graphs for heart failure readmission."
      - q: What does your tech stack look like?
        a: "Python, vLLM and SLURM on UF's HiPerGator supercomputer, config-driven pipelines with JSON Schema and Pydantic, plus PyTorch, OMOP and FHIR on the clinical data side."
      - q: Where have you worked?
        a: "The University of Florida (Data Scientist III, and before that Application Programmer and Research Assistant) and the Regenstrief Institute in Indianapolis. The full story is on my [CV](/cv/)."
      - q: Can we collaborate?
        a: "I'd love to hear from you. Email me at [huyuaaaray@gmail.com](mailto:huyuaaaray@gmail.com) or find me on LinkedIn."
      - q: Tell me a secret.
        a: "Try clicking my name at the very top of this page. Go Gators!"
  greeting:
    morning: Good morning ☀️
    afternoon: Good afternoon 🌤️
    evening: Good evening 🌙
    night: Hello, night owl 🦉
  orbit_icons: ["🧠", "🩺", "💻", "🐊"]
  code_rain:
    - "from vllm import LLM, SamplingParams"
    - "llm = LLM(model=\"google/gemma-4-31b\", max_model_len=65536)"
    - "params = SamplingParams(temperature=0.0, max_tokens=1024)"
    - "notes = load_notes(cohort=\"readmission\")"
    - "for batch in chunks(notes, size=32):"
    - "    outputs = llm.generate(build_prompts(batch), params)"
    - "    verdicts = judge(outputs, rubric=\"clinical_safety\")"
    - "    flag_for_review(v for v in verdicts if v.score < 3)"
    - "graph = build_graph(entities, relations)"
    - "communities = leiden(graph, levels=7)"
  ask_joke:
    q: Tell me a joke
    a: "Why did the language model see a doctor? Too many hallucinations. Don't worry, catching those is my day job. 🐊"
  news_title: News
  news_show: 6
  news_more: More news
  news_less: Show less
  news:
    - date: Aug 2026
      datetime: 2026-08
      text: Co-first-author paper on adapting a fair individualized polysocial risk score for hospitalization risk prediction published in *JAMIA Open*.
    - date: '2026'
      datetime: '2026'
      text: Two papers on target trial emulation with decentralized real-world data published in *npj Health Systems* and *eBioMedicine*.
    - date: May 2026
      datetime: 2026-05
      text: Started building a GraphRAG knowledge graph over clinical notes to study heart failure readmission.
    - date: Apr 2026
      datetime: 2026-04
      text: Began leading a clinical LLM evaluation comparing Gemma 4 and MedGemma for patient-level readmission review.
    - date: Feb 2026
      datetime: 2026-02
      text: Started building a shared, configuration-driven LLMOps platform, now used by three clinical programs at UF.
    - date: Sep 2025
      datetime: 2025-09
      text: Joined the Quality & Patient Safety group at the UF College of Medicine as a Data Scientist III.

