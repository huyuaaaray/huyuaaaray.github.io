# =====================================================================
#  网站内容总表（所有可以修改的文字都在这个文件里）
#
#  怎么改：直接改冒号后面的文字，保存后 push，GitHub 大约 1 分钟后更新网站。
#  注意：
#    1. 缩进只能用空格，不能用 Tab，并且要和上下文对齐。
#    2. 文字里有冒号 : 或以 * 开头时，用英文双引号把整句包起来。
#    3. 标着 (Markdown) 的地方可以用 *斜体*、**粗体**、[链接文字](https://...)
#    4. 列表的每一项以 "- " 开头；想加一条就复制一整段再改。
#
#  目录：
#    一、网站设置        二、个人信息与导航     三、首页
#    四、Travel 页面     五、CV 页面            六、404 页面
# =====================================================================


