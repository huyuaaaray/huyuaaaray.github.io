cv:
  title: CV
  heading: Curriculum Vitae
  description: Curriculum vitae of Yu Hu, covering clinical LLM evaluation, LLMOps, and machine learning on EHR data at the University of Florida College of Medicine.
  summary: Data scientist with 3+ years of experience in clinical LLM evaluation and safety on EHR and clinical notes data. Built LLM-as-a-Judge and clinician-validated evaluation workflows, and end-to-end MLOps/LLMOps pipelines, including a config-driven LLM platform adopted by three clinical programs with self-hosted inference on HPC (vLLM).
  download_label: Download PDF
  copy_label: Copy citation
  copied_label: Copied!
  highlights:
    - LLM-as-a-Judge
    - clinical safety failure mode
    - config-driven LLM platform
    - GraphRAG pipeline
    - Leiden community detection
    - clinically meaningful features
  experience_title: Experience
  education_title: Education
  publications_title: Publications
  projects_title: Selected Projects
  skills_title: Skills
  honors_title: Honors & Service
  publications_note: "\\* Equal contribution. Full list on [Google Scholar](https://scholar.google.com/citations?user=SL4Guq4AAAAJ)."
  experience:
    - title: Data Scientist III
      dates: Sep 2025 – Present
      where: University of Florida College of Medicine, Gainesville, FL
      bullets:
        - Drive clinical LLM evaluation for the Quality & Patient Safety group, comparing models against clinician review and building LLM-as-a-Judge workflows that route flagged outputs to clinician review.
        - Architected a shared, config-driven LLMOps platform adopted by three clinical programs, processing EHR clinical notes with self-hosted long-context inference (vLLM, SLURM) on the HiPerGator HPC cluster.
        - Translate clinical review workflows (readmission, mortality, transitional care) into structured, evidence-grounded LLM pipelines in partnership with clinical teams.
        - Develop machine learning models on EHR data, including neonatal feeding-risk prediction, from clinician-validated feature definition through on-premise deployment.
    - title: Application Programmer
      dates: Jun 2025 – Aug 2025
      where: Regenstrief Institute, Indianapolis, IN
      bullets:
        - Standardized U.S. EHR data by architecting pipelines for OMOP and PCORnet models, improving data quality and harmonization.
        - Engineered automated, scalable ETL pipelines and extracted longitudinal clinical features from raw EHR data using distributed cluster computing.
        - Created web-based analytics dashboards to support clinicians in interpreting complex data and improving decision-making.
    - title: Application Programmer
      dates: Mar 2024 – May 2025
      where: University of Florida, Gainesville, FL
      bullets:
        - Implemented MLOps workflows with CI/CD and monitoring, enabling scalable deployment on Linux systems.
        - Developed scalable ETL pipelines and engineered clinical features using cluster computing, boosting ML model performance on large-scale healthcare data.
        - Built and deployed secure, interactive healthcare web applications with FHIR integration on AWS, enhancing scalability, reliability, and clinical interoperability.
    - title: Research Assistant
      dates: Dec 2022 – Feb 2024
      where: University of Florida, Gainesville, FL
      bullets:
        - Cleaned and preprocessed extensive healthcare datasets, generating insightful visualizations to support data-driven research.
        - Developed a computer vision-based object detection system integrated with automated data acquisition pipelines, enabling efficient data collection and analysis.
        - Built and deployed an interactive web platform for 3D modeling and predictive analytics, enhancing visualization of object detection outcomes and improving user experience.
  education:
    - title: M.S. in Electrical and Computer Engineering
      dates: Aug 2021 – May 2023
      where: University of Florida, Gainesville, FL
      summary: 'GPA: 3.56/4.0'
    - title: B.S. in Electrical Engineering
      dates: Sep 2016 – Jun 2020
      where: Hubei University of Technology, Wuhan, China
      summary: 'GPA: 3.3/4.0'
  publications:
    - authors: Jiayi Tong, Lu Li, Dazheng Zhang, Kyra S. O'Brien, Yiwen Lu, Qiong Wu, Ting Zhou, Bingyu Zhang, Yu Huang, Yu Hu, et al.
      title: 'FLAT-WHITE: from target trial emulation to federated high-throughput causal machine learning using decentralized real-world data.'
      venue: npj Health Systems
      details: 3, 102 (2026).
    - authors: Qiong Wu, Lu Li, Yuqing Lei, Ting Zhou, Huiling Tang, Bingyu Zhang, Yu Hu, et al.
      title: 'Discovering repurposable drugs for Alzheimer''s disease and related dementias: target trial emulation using decentralised real-world data.'
      venue: eBioMedicine
      details: 132, 106466 (2026).
    - authors: Qinglin Gou*, Yu Hu*, et al.
      title: Adaptation of a fair individualized polysocial risk score for hospitalization risk prediction.
      venue: JAMIA Open
      details: 9(4), ooag161 (2026).
      links:
        - label: DOI
          url: https://doi.org/10.1093/jamiaopen/ooag161
    - authors: Yu Huang, Jie Xu, Zhengkang Fan, Yu Hu, et al.
      title: Identifying Alzheimer's disease progression subphenotypes via a graph-based framework using electronic health records.
      venue: Journal of Healthcare Informatics Research
      details: 10, 317–339 (2026).
    - authors: X. He, Y. Huang, Yu Hu, et al.
      title: Toward integrating machine learning-powered polysocial risk scores into electronic health record workflows.
      venue: AMIA Annual Symposium Proceedings
      details: 2024, 451–460 (2025).
      links:
        - label: PMC
          url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12919456/
    - authors: T. Zhou, A. Chen, Yu Hu, et al.
      title: Automating Lung-RADS categorization and follow-up recommendations using in-context learning with large language models.
      venue: AMIA Annual Symposium Proceedings
      details: 2024, 1567–1576 (2025).
      links:
        - label: PMC
          url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12919574/
    - authors: Jin Wang*, Yu Hu*, et al.
      title: 'Technical note: ShinyAnimalCV: open-source cloud-based web application for object detection, segmentation, and three-dimensional visualization of animals using computer vision.'
      venue: Journal of Animal Science
      details: 102, skad416 (2024).
      links:
        - label: DOI
          url: https://doi.org/10.1093/jas/skad416
  projects:
    - title: Clinical LLM Evaluation and Model Selection for Readmission Review
      dates: Apr 2026 – Present
      bullets:
        - Led a head-to-head evaluation of Gemma 4 31B and MedGemma for patient-level readmission review across 30K–80K-token context windows, generating structured answers to clinical review questions with supporting rationales.
        - 'Identified a key clinical safety failure mode: the domain-tuned model inferred unsupported answers from general medical knowledge (e.g., asserting prescriptions were sent to a pharmacy with no documentation), while Gemma 4 abstained with evidence-specific rationales, providing evidence for model selection.'
        - 'Validated outputs against clinician review: Gemma 4 corrected 7 of 10 answers the clinical team flagged as incorrect; analyzed the remaining disagreements to separate model errors from reviewer inference, and identified note-type confusion (outpatient vs. discharge instructions) as the next improvement target.'
        - Built an LLM-as-a-Judge framework using Llama 3.3-70B to grade Gemma 4 outputs across four rubric dimensions with structured JSON verdicts, section-level scoring, and an interactive HTML report routing flagged patients to clinician review.
        - Benchmarked long-context inference on NVIDIA B200 GPUs (FP16 vs. FP8, tensor parallelism, memory settings); traced a throughput ceiling to vLLM's KV-cache handling of Gemma 4 sliding-window attention and reached 30–50 tokens/s at 60K context with FP8.
    - title: Clinical LLMOps Platform for EHR Note Processing
      dates: Feb 2026 – Present
      bullets:
        - Generalized hard-coded, project-specific clinical NLP scripts into a reusable, config-driven LLM platform now shared by three clinical programs (RN Health Coach, Bridge Clinic readmission, Transitional Care); migrated all runtime settings into YAML with a `ConfigWrapper` supporting dotted-attribute and mapping access, so new cohorts onboard through configuration rather than code changes.
        - Designed a modular workflow architecture (schema-driven data loading → prompt assembly → batched inference → post-processing → reporting) with a manager/processor per stage, checkpoint/resume, structured logging, and asynchronous concurrency control; deployed on the HiPerGator HPC cluster via SLURM and vLLM.
        - Re-engineered the clinical note LLM summarizer into an OpenAI-compatible API service that runs on both self-hosted vLLM and the UF NaviGator API, with enforced JSON Schema output contracts, Pydantic validation, token-aware dynamic prompt budgeting, and automatic retry/fallback on malformed generations.
        - Built a reusable base HTML report generator and pluggable LLM analysis sections, so programs extend shared components instead of maintaining separate reporting code.
        - Established MLOps practices across projects (versioned shared libraries on internal GitLab, automated daily scheduling and logging, reproducible run artifacts), reducing new-pipeline setup from weeks to days.
    - title: GraphRAG Knowledge Graph for Heart Failure Readmission
      dates: May 2026 – Present
      bullets:
        - Built an end-to-end GraphRAG pipeline over a heart failure cohort of 637K clinical notes from 3,946 patients, including de-duplication of daily EHR snapshots, a three-layer note filter (note type / authoring provider type / length), and quota-based cohort sampling for documentation completeness.
        - Performed LLM-based entity and relation extraction with MedGemma-27B served via vLLM, using a clinical prompt with a controlled entity-type and assertion (present/negated/historical) vocabulary; extracted 143K entities, 71K relations, and 243K attributes from 5.5K text units.
        - Constructed the patient knowledge graph with hierarchical Leiden community detection (2,040 communities across 7 levels) and map-reduce LLM community reports on readmission themes; hardened the pipeline against API rate-limit saturation, silent chunk drops, and PHI leakage into summaries.
    - title: Neonatal Lactation and Milk Intake Data Processing Project
      dates: Sep 2025 – Present
      bullets:
        - Standardized raw EHR lactation and neonatal milk intake data (pumping records, feeding documentation, inconsistent entries) and built automated feature engineering pipelines.
        - Partnered with neonatologists and lactation specialists to define and validate clinically meaningful features, such as NPO patterns, respiratory support status, maternal milk availability, feeding intolerance, and early nutrition indicators.
        - Developed machine learning models for early identification of infants at risk for inadequate milk intake or feeding complications; revalidated data and feature definitions after source updates, retrained the models, and authored a model brief.
        - Deployed model and data pipelines on on-premise servers for reproducible, continuously updated analytics, and connected Power BI dashboards to model outputs for clinicians and lactation teams.
    - title: Graph-Based Modeling for Alzheimer's Disease Progression
      dates: Dec 2023 – Nov 2025
      summary: Built patient similarity graphs from EHR data and graph neural networks (PyTorch, NetworkX) to identify progression subphenotypes and support early detection.
    - title: EHR Continuity for Type 2 Diabetes Risk Prediction
      dates: Feb 2024 – Nov 2025
      summary: Engineered a PCORnet-based pipeline on OneFlorida+ data, used the Harmonized Encounter Proportion Score to quantify data continuity, and assessed model fairness across racial and ethnic groups.
    - title: OCT Retinal Biomarkers for ADRD Prediction
      dates: Dec 2023 – Sep 2025
      summary: Automated processing of OCT DICOM scans and used retinal thickness metrics to model the risk of Alzheimer's disease and related dementias.
    - title: Healthcare Risk Prediction Web Application
      dates: Nov 2023 – Sep 2025
      summary: React front end and Flask API serving causal inference risk models, with FHIR and Epic integration, containerized with Docker.
    - title: OMOP–FHIR Database Integration Platform
      dates: Apr 2024 – Sep 2025
      summary: Designed an OMOP database and a web platform combining OMOP and FHIR queries for standardized, real-time healthcare data access.
  skills:
    - group: LLM & NLP
      items: Prompt engineering, RAG/GraphRAG, LLM-as-a-Judge, vLLM, LLM agents, Hugging Face Transformers, LangChain, spaCy, FAISS
    - group: Clinical data standards
      items: UMLS, SNOMED CT, RxNorm, OMOP, FHIR, PCORnet
    - group: MLOps / LLMOps
      items: SLURM, model serving and monitoring, CI/CD, structured output (JSON Schema, Pydantic), config-driven pipelines
    - group: Machine learning
      items: PyTorch, TensorFlow, scikit-learn, XGBoost, NetworkX, causal inference
    - group: Programming
      items: Python, SQL, R, C/C++, Java, JavaScript, HTML/CSS, Shell, MATLAB, LaTeX
    - group: Tools & platforms
      items: Docker, Linux, Git, Tableau, Power BI, cluster and cloud computing
