<script>
  // Send old links to their new place (e.g. the previous /CV.pdf on this site).
  (function () {
    var p = location.pathname.toLowerCase().replace(/\/+$/, '');
    var moved = {
      '/cv.pdf': '/resume.pdf',
      '/cv.html': '/cv/',
      '/resume': '/cv/',
      '/about': '/',
      '/contact': '/#contact'
    };
    if (moved[p]) location.replace(moved[p]);
  })();
</script>
<div class="container not-found">
  <h1>{{ site.not_found.title | escape }}</h1>
  <p>{% include inline-md.html text=site.not_found.text %}</p>
</div>
