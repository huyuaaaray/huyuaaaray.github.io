# Each project: title, dates, then either bullets or a one-paragraph summary
projects:
  - title: Clinical LLM Evaluation and Model Selection for Readmission Review
    dates: Apr 2026 – Present
    bullets:
      - Led a head-to-head evaluation of Gemma 4 31B and MedGemma for patient-level readmission review across 30K–80K-token contexts, validating outputs against clinician review.
      - Identified a key safety failure mode, where the domain-tuned model inferred answers unsupported by the record while Gemma 4 abstained with evidence-specific rationales.
      - Built an LLM-as-a-Judge framework (Llama 3.3-70B) with rubric-based JSON verdicts and an HTML report that routes flagged patients to clinician review.
      - Benchmarked long-context inference on NVIDIA B200 GPUs (FP16 vs. FP8, tensor parallelism) and traced a throughput ceiling to vLLM's KV-cache handling of sliding-window attention.
  - title: Clinical LLMOps Platform for EHR Note Processing
    dates: Feb 2026 – Present
    bullets:
      - Generalized project-specific clinical NLP scripts into a reusable, config-driven LLM platform shared by three clinical programs, so new cohorts onboard through configuration rather than code changes.
      - Designed a modular pipeline (data loading, prompt assembly, batched inference, post-processing, reporting) with checkpoint/resume and asynchronous concurrency control on HiPerGator via SLURM and vLLM.
      - Re-engineered the clinical note summarizer into an OpenAI-compatible service with JSON Schema output contracts, Pydantic validation, and automatic retry on malformed generations.
  - title: GraphRAG Knowledge Graph for Heart Failure Readmission
    dates: May 2026 – Present
    bullets:
      - Built an end-to-end GraphRAG pipeline over a heart failure cohort's clinical notes, with LLM-based entity and relation extraction using MedGemma-27B served via vLLM.
      - Constructed the patient knowledge graph with hierarchical Leiden community detection and map-reduce LLM community reports on readmission themes.
  - title: Neonatal Lactation and Milk Intake Modeling
    dates: Sep 2025 – Present
    bullets:
      - Partnered with neonatologists and lactation specialists to define clinically validated features from EHR feeding and lactation data.
      - Developed models for early identification of infants at risk for inadequate milk intake or feeding complications, deployed on-premise with Power BI dashboards for clinical teams.
  - title: Graph-Based Modeling for Alzheimer's Disease Progression
    dates: Dec 2023 – Nov 2025
    summary: Built patient similarity graphs from EHR data and graph neural networks (PyTorch, NetworkX) to identify progression subphenotypes and support early detection.
  - title: EHR Continuity for Type 2 Diabetes Risk Prediction
    dates: Feb 2024 – Nov 2025
    summary: Engineered a PCORnet-based pipeline on OneFlorida+ data, used the Harmonized Encounter Proportion Score to quantify data continuity, and assessed model fairness across racial and ethnic groups.
  - title: OCT Retinal Biomarkers for ADRD Prediction
    dates: Dec 2023 – Sep 2025
    summary: Automated processing of OCT DICOM scans and used retinal thickness metrics to model the risk of Alzheimer's disease and related dementias.
  - title: Healthcare Risk Prediction Web Application
    dates: Nov 2023 – Sep 2025
    summary: React front end and Flask API serving causal inference risk models, with FHIR and Epic integration, containerized with Docker.
  - title: OMOP–FHIR Database Integration Platform
    dates: Apr 2024 – Sep 2025
    summary: Designed an OMOP database and a web platform combining OMOP and FHIR queries for standardized, real-time healthcare data access.

