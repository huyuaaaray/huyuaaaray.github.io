# Places shown on the Travel page (map markers + cards).
# Order here = order of the cards. Copy a block to add a new place.
#
#   name:     place name (big title)
#   region:   state / province and country, shown under the name
#   country:  used to count countries on the page
#   lat, lng: coordinates. Find them on Google Maps: right-click the spot
#             and click the numbers at the top of the menu to copy them.
#   date:     free text, e.g. "Mar 2025" or "2016 – 2020"
#   summary:  one or two sentences
#   cover:    image for the card and the map preview
#   photos:   any number of images (put files in images/travel/)
#   home:     true for your home base; flight routes on the map start here
#   videos:   YouTube or Bilibili. Paste the video link or just its ID:
#               - youtube: https://www.youtube.com/watch?v=VIDEO_ID
#               - bilibili: https://www.bilibili.com/video/BVxxxxxxxxxx
#
# The three entries below are examples with placeholder photos.
# Replace the text and photos with your own.

