<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/" aria-label="{{ site.author.name }}, home">
      <img src="/images/header-icon.png" alt="" width="98" height="96">
      <span class="brand-name">{{ site.author.name }}</span>
    </a>
    <div class="header-right">
      <nav class="tabs" aria-label="Main">
        {%- for item in site.nav %}
        <a class="tab" href="{{ item.url }}" {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.label | escape }}</a>
        {%- endfor %}
      </nav>
      <span class="header-divider" aria-hidden="true"></span>
      <div class="social">{% include social-links.html %}</div>
    </div>
  </div>
</header>
